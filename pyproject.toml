[project]
name = "nexus-seed"
version = "0.1.0"
description = "A durable event-driven runtime with safe autonomous capability acquisition."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
nexus-seed = "nexus_seed.app:main"
nexus-seed-demo = "nexus_seed.demo:main"
nexus-seed-ingress = "nexus_seed.ingress_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_seed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
