[project]
name = "nexus-project-manager"
version = "0.1.0"
description = "Project lifecycle, routing, assignment, workspace grants, and A2A project execution integration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_project_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
