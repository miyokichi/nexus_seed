[project]
name = "nexus-planner"
version = "0.1.0"
description = "Planning interfaces and proposal generation from context, observation, and knowledge."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_planner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
