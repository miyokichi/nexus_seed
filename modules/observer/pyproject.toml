[project]
name = "nexus-observer"
version = "0.1.0"
description = "External observation, ingress envelopes, sources, and observer adapters."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_observer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
