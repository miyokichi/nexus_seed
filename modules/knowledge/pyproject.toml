[project]
name = "nexus-knowledge"
version = "0.1.0"
description = "Knowledge domain, ledger, query, and Semantica-facing services for NEXUS SEED."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexus_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
